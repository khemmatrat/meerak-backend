services:
  - type: web
    name: meerak-backend
    env: node
    # WAR-P0-01: backend deps live under backend/ — root-only npm install breaks production start
    buildCommand: npm ci --prefix backend
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      # ตั้งใน Render Dashboard: JWT_SECRET (สำหรับ admin login), CORS_ORIGIN (รวม http://localhost:3000 สำหรับ Nexus Admin)
