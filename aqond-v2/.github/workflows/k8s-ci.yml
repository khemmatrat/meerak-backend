name: K8s CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'aqond-v2/**'
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}/aqond-v2

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        working-directory: aqond-v2/infra/helm/aqond
        run: |
          helm lint . -f values.yaml
          helm lint . -f values-dev.yaml
          helm template aqond . -f values-dev.yaml > /tmp/rendered.yaml
          echo "Rendered $(wc -l < /tmp/rendered.yaml) lines"

  build-go-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog-svc, order-svc, inventory-svc, wallet-svc, foundation-svc, feed-svc, video-svc, rec-svc, readmodel-svc]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: aqond-v2
          file: aqond-v2/infra/docker/go-service.Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            PORT=8110
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan-images:
    needs: build-go-images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-svc, catalog-svc]
    steps:
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '0'

  deploy-staging:
    needs: [helm-lint, build-go-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package chart
        working-directory: aqond-v2/infra/helm/aqond
        run: helm package . --version 0.6.0-${{ github.run_number }}
      - name: Deploy note
        run: echo "Push chart to OCI / trigger ArgoCD sync (P66 GitOps)"
