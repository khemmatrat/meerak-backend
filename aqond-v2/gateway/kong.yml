  - name: rate-limiting
    config:
      minute: 600
      policy: local
  - name: cors
    config:
      origins:
        - http://localhost:8000
        - http://localhost:3000
        - http://127.0.0.1:3000
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
