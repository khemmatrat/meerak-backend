_format_version: "3.0"
_transform: true

services:
  - name: kong-health
    url: http://escrow-service:8091
    routes:
      - name: root-health
        paths:
          - /health
        strip_path: false
        methods:
          - GET

  - name: marketplace-upstream
    url: http://marketplace-web:8080
    connect_timeout: 60000
    read_timeout: 120000
    write_timeout: 120000
    routes:
      - name: marketplace-read
        paths:
          - /api/v1/marketplace
        strip_path: true
        methods:
          - GET
          - HEAD
          - OPTIONS
      - name: marketplace-write
        paths:
          - /api/v1/marketplace
        strip_path: true
        methods:
          - POST
          - PUT
          - PATCH
          - DELETE
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
              key_claim_name: iss
    plugins:
      - name: rate-limiting
        config:
          minute: 300
          policy: local
      # JWT on seller/admin write routes in P2b — catalog read is public for P2a shop

  # LiveKit WebRTC: browsers connect ws://localhost:7880 directly (port 7880).
  # All live API (token, F-Code, studio UI) → live-token-service below.

  - name: live-token-service
    url: http://live-token-service:8092
