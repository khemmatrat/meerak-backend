  # =========================================================================
  # P46-P60: Citus sharding + Redis Cluster (dev-lite)
  # Enable Citus: USE_CITUS=1 on Go services after migrate-commerce-to-citus.ps1
  # =========================================================================
  citus-worker-1:
    profiles:
      - dev-lite
    image: citusdata/citus:12.1
    container_name: aqond-v2-citus-w1
    env_file:
      - ./infra/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin_boss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: commerce
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${AQOND_DATA_ROOT:-E:/aqond-data}/citus-worker-1:/var/lib/postgresql/data
    networks:
      - aqond-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin_boss} -d commerce"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  citus-worker-2:
    profiles:
      - dev-lite
    image: citusdata/citus:12.1
    container_name: aqond-v2-citus-w2
    env_file:
      - ./infra/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin_boss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: commerce
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${AQOND_DATA_ROOT:-E:/aqond-data}/citus-worker-2:/var/lib/postgresql/data
    networks:
      - aqond-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin_boss} -d commerce"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  citus-coordinator:
    profiles:
      - dev-lite
    image: citusdata/citus:12.1
    container_name: aqond-v2-citus-coord
    env_file:
      - ./infra/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin_boss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: commerce
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${AQOND_DATA_ROOT:-E:/aqond-data}/citus-coordinator:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - aqond-network
    depends_on:
      citus-worker-1:
        condition: service_healthy
      citus-worker-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin_boss} -d commerce"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  redis-node-1:
    profiles:
      - dev-lite
    image: redis:7-alpine
    container_name: aqond-v2-redis-n1
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    networks:
      - aqond-network
    restart: unless-stopped

  redis-node-2:
    profiles:
      - dev-lite
    image: redis:7-alpine
    container_name: aqond-v2-redis-n2
