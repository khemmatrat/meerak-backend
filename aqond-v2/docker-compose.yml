    networks:
      - aqond-network
    restart: unless-stopped

  redis-node-3:
    profiles:
      - dev-lite
    image: redis:7-alpine
    container_name: aqond-v2-redis-n3
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    networks:
      - aqond-network
    restart: unless-stopped

  hermes-orchestrator:
    profiles:
      - dev-lite
    build:
      context: ./hermes-orchestrator
    container_name: aqond-v2-hermes
    env_file:
      - ./infra/.env
    environment:
      PORT: 8120
      PGHOST: aqond-db
      PGDATABASE: commerce
      PGUSER: ${POSTGRES_USER:-admin_boss}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://aqond-redis:6379/1
      KAFKA_BROKERS: redpanda:9092
      AI_CORE_URL: http://ai-core:8100
      AI_CORE_API_KEY: ${AI_CORE_API_KEY}
      HERMES_API_KEY: ${AI_CORE_API_KEY}
      HERMES_USE_RULES_ONLY: ${HERMES_USE_RULES_ONLY:-1}
      CATALOG_SERVICE_URL: http://catalog-svc:8110
      ORDER_SERVICE_URL: http://order-svc:8113
    networks:
      - aqond-network
    depends_on:
      aqond-db:
        condition: service_healthy
      aqond-redis:
        condition: service_started
      redpanda:
        condition: service_started
      ai-core:
        condition: service_started
    restart: unless-stopped
