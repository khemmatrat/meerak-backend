networks:
  aqond-network:
    driver: bridge

# Data on E: via AQOND_DATA_ROOT in infra/.env (default E:/aqond-data)

services:
  # =========================================================================
  # P0: Central Postgres (multi-database via init script)
  # =========================================================================
  aqond-db:
    image: postgres:15-alpine
    container_name: aqond-v2-db
    env_file:
      - ./infra/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin_boss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: postgres
    volumes:
      - ${AQOND_DATA_ROOT:-E:/aqond-data}/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/01-init-multiple-dbs.sh:ro
    networks:
      - aqond-network
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin_boss} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  aqond-redis:
    image: redis:7-alpine
    container_name: aqond-v2-redis
    ports:
      - "6379:6379"
    networks:
      - aqond-network
    restart: unless-stopped

  aqond-mongo:
    profiles:
      - optional
    image: mongo:6
    container_name: aqond-v2-mongo
    networks:
      - aqond-network
    restart: unless-stopped

  # =========================================================================
  # P1: Kong API Gateway (DB-less declarative)
  # =========================================================================
  kong:
    image: kong:3.4
    container_name: aqond-v2-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_PLUGINS: bundled
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"
      - "8443:8443"
    networks:
      - aqond-network
    depends_on:
      aqond-db:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================================
  # P2a: MinIO object storage (product images)
  # =========================================================================
  minio:
    image: minio/minio:latest
    container_name: aqond-v2-minio
    command: server /data --console-address ":9001"
    env_file:
      - ./infra/.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aqond_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infra/.env}
    volumes:
      - ${AQOND_DATA_ROOT:-E:/aqond-data}/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - aqond-network
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: aqond-v2-minio-init
    depends_on:
      - minio
    env_file:
      - ./infra/.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aqond_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-aqond-products}
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb -p local/$$MINIO_BUCKET || true;
      mc anonymous set download local/$$MINIO_BUCKET;
      mc mb -p local/aqond-videos || true;
      echo MinIO bucket ready: $$MINIO_BUCKET + aqond-videos;
      "
    networks:
      - aqond-network
    restart: "no"

  # =========================================================================
  # P2: Marketplace catalog sync (Bagisto-ready bridge)
  # =========================================================================
  marketplace-web:
    build:
      context: ./marketplace
      dockerfile: Dockerfile
    container_name: aqond-v2-marketplace
    env_file:
      - ./infra/.env
    environment:
      PORT: 8080
      AQOND_ENV: ${AQOND_ENV:-development}
      DB_HOST: aqond-db
      DB_DATABASE: bagisto
      DB_USERNAME: ${POSTGRES_USER:-admin_boss}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      BAGISTO_WEBHOOK_SECRET: ${BAGISTO_WEBHOOK_SECRET}
      BAGISTO_APP_URL: ${BAGISTO_APP_URL:-}
      BAGISTO_AQOND_SYNC_KEY: ${BAGISTO_WEBHOOK_SECRET}
      ESCROW_SERVICE_URL: http://escrow-service:8091
      ESCROW_API_KEY: ${ESCROW_API_KEY}
      AI_CORE_URL: http://ai-core:8100
      AI_CORE_API_KEY: ${AI_CORE_API_KEY}
      P6_SLA_HOURS: ${P6_SLA_HOURS:-48}
      ANALYTICS_URL: http://analytics-service:8095
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY}
    networks:
      - aqond-network
    depends_on:
      aqond-db:
        condition: service_healthy
      escrow-service:
        condition: service_started
    restart: unless-stopped

  # =========================================================================
  # P2b: MySQL + Bagisto mirror bridge (optional profile)
  # Enable: docker compose --profile p2b-bagisto up -d
  # =========================================================================
  bagisto-mysql:
    profiles:
      - p2b-bagisto
    image: mysql:8.0
    container_name: aqond-v2-bagisto-mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4
    env_file:
      - ./infra/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in infra/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bagisto}
      MYSQL_USER: ${MYSQL_USER:-bagisto}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in infra/.env}
    volumes:
      - ${AQOND_DATA_ROOT:-E:/aqond-data}/mysql-bagisto:/var/lib/mysql
      - ./infra/mysql-bagisto/init:/docker-entrypoint-initdb.d:ro
      - ./infra/mysql-bagisto/healthcheck-grants.sh:/usr/local/bin/aqond-mysql-ready.sh:ro
    networks:
      - aqond-network
    ports:
      - "3307:3306"
    healthcheck:
      # First init on E: bind mount can take 10-15 min on Windows; also ensures bagisto@% grants
      test: ["CMD-SHELL", "bash /usr/local/bin/aqond-mysql-ready.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 600s
    restart: unless-stopped

  # P2b+ Full Bagisto Laravel (admin + storefront) — shares bagisto-mysql
  bagisto-app:
    profiles:
      - p2b-bagisto
    image: webkul/bagisto:2.4.3
    container_name: aqond-v2-bagisto-app
    env_file:
      - ./infra/.env
    environment:
      APP_URL: ${BAGISTO_ADMIN_URL:-http://localhost:8099}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${BAGISTO_LARAVEL_APP_KEY:-}
      DB_HOST: bagisto-mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-bagisto}
      DB_USERNAME: ${MYSQL_USER:-bagisto}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_AUTOSTART: "false"
    volumes:
      - ${AQOND_DATA_ROOT:-E:/aqond-data}/bagisto-app:/var/www/html/storage
    networks:
      - aqond-network
    ports:
      - "8099:80"
    depends_on:
      bagisto-mysql:
        condition: service_healthy
    restart: unless-stopped

  bagisto-bridge:
    profiles:
      - p2b-bagisto
    build:
      context: ./marketplace/bagisto-bridge
    container_name: aqond-v2-bagisto-bridge
    env_file:
      - ./infra/.env
    environment:
      PORT: 8089
      MYSQL_HOST: bagisto-mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bagisto}
      MYSQL_USER: ${MYSQL_USER:-bagisto}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      BAGISTO_AQOND_SYNC_KEY: ${BAGISTO_WEBHOOK_SECRET}
    networks:
      - aqond-network
    depends_on:
      bagisto-mysql:
        condition: service_healthy
    restart: unless-stopped

  escrow-service:
    build:
      context: ./marketplace/escrow-service
    container_name: aqond-v2-escrow
    env_file:
      - ./infra/.env
    environment:
      PORT: 8091
      AQOND_ENV: ${AQOND_ENV:-development}
      PGHOST: aqond-db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-admin_boss}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: escrow
      ESCROW_API_KEY: ${ESCROW_API_KEY}
    networks:
      - aqond-network
    depends_on:
      aqond-db:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================================
  # P3: CMS / Strapi sync stub
  # =========================================================================
  cms-service:
    build:
      context: ./cms
    container_name: aqond-v2-cms
    env_file:
      - ./infra/.env
    environment:
      PORT: 8094
      AQOND_ENV: ${AQOND_ENV:-development}
      CMS_API_KEY: ${CMS_API_KEY}
      BAGISTO_WEBHOOK_URL: http://marketplace-web:8080/internal/sync-product
      BAGISTO_WEBHOOK_SECRET: ${BAGISTO_WEBHOOK_SECRET}
      AI_CORE_URL: http://ai-core:8100
      AI_CORE_API_KEY: ${AI_CORE_API_KEY}
      AI_ONBOARD_TIMEOUT_MS: ${AI_ONBOARD_TIMEOUT_MS:-600000}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-aqond-products}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-aqond_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    networks:
      - aqond-network
    depends_on:
      - marketplace-web
      - ai-core
      - minio
      - minio-init
    restart: unless-stopped

  # =========================================================================
  # P4: LiveKit + token service
  # =========================================================================
  livekit:
    image: livekit/livekit-server:v1.5
    container_name: aqond-v2-livekit
    command: --config /livekit.yaml --dev
    volumes:
      - ./live/livekit.yaml:/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50010:50000-50010/udp"
    networks:
      - aqond-network
    restart: unless-stopped

  live-token-service:
    build:
      context: ./live/token-service
    container_name: aqond-v2-live-token
    env_file:
      - ./infra/.env
    environment:
      PORT: 8092
      AQOND_ENV: ${AQOND_ENV:-development}
      LIVE_MERCHANT_API_KEY: ${LIVE_MERCHANT_API_KEY}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-dev-livekit-secret-min-32-chars-ok}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_HTTP_URL: http://livekit:7880
      MARKETPLACE_URL: http://marketplace-web:8080
      NOTIFY_SERVICE_URL: http://notify-service:8096
      NOTIFY_API_KEY: ${NOTIFY_API_KEY}
      LIVE_COMMERCE_URL: http://live-commerce-svc:8097
    networks:
      - aqond-network
    depends_on:
      - livekit
      - marketplace-web
      - notify-service
      - aqond-db
    restart: unless-stopped

  live-commerce-svc:
    build:
      context: ./live/commerce-service
    container_name: aqond-v2-live-commerce
    env_file:
      - ./infra/.env
    environment:
      PORT: 8097
      PGHOST: aqond-db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-admin_boss}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: commerce
      REDIS_HOST: aqond-redis
      ORDER_SERVICE_URL: http://order-svc:8113
      CATALOG_SERVICE_URL: http://catalog-svc:8110
      ADDRESS_SERVICE_URL: http://address-svc:8128
      SHIPPING_SERVICE_URL: http://shipping-svc:8127
      AI_CORE_URL: http://ai-core:8100
      AI_CORE_API_KEY: ${AI_CORE_API_KEY}
      LIVE_MERCHANT_API_KEY: ${LIVE_MERCHANT_API_KEY}
      LIVE_TOKEN_URL: http://live-token-service:8092
    ports:
      - "8097:8097"
    networks:
      - aqond-network
    depends_on:
      - aqond-db
      - aqond-redis
      - ai-core
    restart: unless-stopped

  # =========================================================================
  # P5: Voice Live Closer (WebSocket + ai-core Hermes / GPU-ready)
  # =========================================================================
  voice-service:
    build:
      context: ./voice
    container_name: aqond-v2-voice
    env_file:
      - ./infra/.env
    environment:
      PORT: 8090
      AQOND_ENV: ${AQOND_ENV:-development}
      VOICE_MODEL: ${VOICE_MODEL:-cpu-stub}
      AI_CORE_URL: http://ai-core:8100
      AI_CORE_API_KEY: ${AI_CORE_API_KEY}
      MARKETPLACE_URL: http://marketplace-web:8080
      ORDER_SERVICE_URL: http://order-svc:8113
      SEARCH_SERVICE_URL: http://search-svc:8122
    ports:
      - "8090:8090"
    networks:
      - aqond-network
    depends_on:
      - ai-core
      - marketplace-web
    restart: unless-stopped

  # =========================================================================
  # Chat stub (existing custom chat integration point)
  # =========================================================================
  chat-service:
    build:
      context: ./chat
    container_name: aqond-v2-chat
    environment:
      PORT: 8093
      LIVE_COMMERCE_URL: http://live-commerce-svc:8097
    networks:
      - aqond-network
    depends_on:
      - live-commerce-svc
    restart: unless-stopped

  # =========================================================================
  # P6: n8n automation + lightweight notify
  # =========================================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: aqond-v2-n8n
    env_file:
      - ./infra/.env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: aqond-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-admin_boss}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-localhost}
      WEBHOOK_URL: http://kong:8000/api/v1/automation
      BAGISTO_WEBHOOK_SECRET: ${BAGISTO_WEBHOOK_SECRET}
    volumes:
      - ${AQOND_DATA_ROOT:-E:/aqond-data}/n8n:/home/node/.n8n
      - ./automation/n8n-workflows:/import:ro
    networks:
      - aqond-network
    depends_on:
      aqond-db:
        condition: service_healthy
    restart: unless-stopped

  notify-service:
    build:
      context: ./notifications
    container_name: aqond-v2-notify
    env_file:
      - ./infra/.env
    environment:
      PORT: 8096
      AQOND_ENV: ${AQOND_ENV:-development}
      NOTIFY_API_KEY: ${NOTIFY_API_KEY}
      REDIS_URL: redis://aqond-redis:6379
    networks:
      - aqond-network
    depends_on:
      - aqond-redis
    restart: unless-stopped

  # =========================================================================
  # P8: Hermes AI Core (Ollama + orchestration)
  # =========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: aqond-v2-ollama
    env_file:
      - ./infra/.env
    environment:
      # Override Windows host path from .env — container must use bind mount path
      OLLAMA_MODELS: /root/.ollama
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ${AQOND_DATA_ROOT:-E:/aqond-data}/ollama:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - aqond-network
    restart: unless-stopped
    # GPU profile: deploy on separate server and set OLLAMA_HOST to external IP
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ai-core:
    build:
      context: ./infra/ai-core
    container_name: aqond-v2-ai-core
    env_file:
      - ./infra/.env
    environment:
      PORT: 8100
      AQOND_ENV: ${AQOND_ENV:-development}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL_CHAT: ${OLLAMA_MODEL_CHAT:-hermes3:3b}
      OLLAMA_MODEL_VISION: ${OLLAMA_MODEL_VISION:-moondream}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-540000}
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-1}
      AI_CORE_API_KEY: ${AI_CORE_API_KEY}
      PGHOST: aqond-db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-admin_boss}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ai
      SLA_USE_RULES_ONLY: ${SLA_USE_RULES_ONLY:-0}
      VOICE_USE_RULES_ONLY: ${VOICE_USE_RULES_ONLY:-0}
      CREW_USE_RULES_ONLY: ${CREW_USE_RULES_ONLY:-0}
    networks:
      - aqond-network
    depends_on:
      ollama:
        condition: service_started
      aqond-db:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================================
  # P7: Analytics + CrewAI re-rank (PostHog-lite)
  # =========================================================================
  analytics-service:
    build:
      context: ./analytics
    container_name: aqond-v2-analytics
    env_file:
      - ./infra/.env
    environment:
      PORT: 8095
      AQOND_ENV: ${AQOND_ENV:-development}
      PGHOST: aqond-db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-admin_boss}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: analytics
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY}
      ANALYTICS_PUBLIC_INGEST: ${ANALYTICS_PUBLIC_INGEST:-1}
      AI_CORE_URL: http://ai-core:8100
      AI_CORE_API_KEY: ${AI_CORE_API_KEY}
    networks:
      - aqond-network
    depends_on:
      aqond-db:
        condition: service_healthy
      ai-core:
        condition: service_started
    restart: unless-stopped

  # =========================================================================
  # P9-P22: Go commerce core + Redpanda + Hermes orchestrator
  # docker compose --env-file infra/.env --profile dev-lite up -d
  # Bagisto bridge (p2b-bagisto) DEPRECATED — use catalog-svc instead (P15)
  # =========================================================================
  redpanda:
    profiles:
      - dev-lite
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: aqond-v2-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --smp
      - "1"
      - --memory
      - 512M
      - --overprovisioned
      - --set redpanda.auto_create_topics_enabled=true
    ports:
      - "19092:19092"
    networks:
      - aqond-network
    restart: unless-stopped

  redpanda-console:
    profiles:
      - dev-lite
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: aqond-v2-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8088:8080"
    networks:
      - aqond-network
    depends_on:
      - redpanda
    restart: unless-stopped

  foundation-svc:
    profiles:
      - dev-lite
    build:
      context: .
      dockerfile: services/foundation-svc/Dockerfile
    container_name: aqond-v2-foundation
    env_file:
      - ./infra/.env
    environment:
      PORT: 8101
      KAFKA_BROKERS: redpanda:9092
      PGHOST: aqond-db
      PGDATABASE: commerce
      PGUSER: ${POSTGRES_USER:-admin_boss}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SHARD_COUNT: 2
      USE_CITUS: ${USE_CITUS:-0}
      AQOND_DEFAULT_REGION: TH
    networks:
      - aqond-network
    depends_on:
      aqond-db:
        condition: service_healthy
      redpanda:
        condition: service_started
    restart: unless-stopped

  catalog-svc:
    profiles:
      - dev-lite
    build:
      context: .
      dockerfile: services/catalog-svc/Dockerfile
    container_name: aqond-v2-catalog
    env_file:
      - ./infra/.env
    environment:
      PORT: 8110
      PGHOST: aqond-db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-admin_boss}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: commerce
      PGREADHOST: aqond-db
      REDIS_ADDR: aqond-redis:6379
    networks:
      - aqond-network
    depends_on:
      aqond-db:
        condition: service_healthy
      aqond-redis:
        condition: service_started
    restart: unless-stopped

  inventory-svc:
    profiles:
      - dev-lite
    build:
      context: .
      dockerfile: services/inventory-svc/Dockerfile
    container_name: aqond-v2-inventory
    env_file:
      - ./infra/.env
    environment:
      PORT: 8111
      PGHOST: aqond-db
      PGDATABASE: commerce
      PGUSER: ${POSTGRES_USER:-admin_boss}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REDIS_ADDR: aqond-redis:6379
      INV_SHARD_BUCKETS: 8
      READ_CACHE_TTL_MS: 500
      PGREADHOST: aqond-db
    networks:
      - aqond-network
    depends_on:
      aqond-db:
        condition: service_healthy
      aqond-redis:
        condition: service_started
    restart: unless-stopped

  wallet-svc:
    profiles:
      - dev-lite
    build:
      context: .
      dockerfile: services/wallet-svc/Dockerfile
    container_name: aqond-v2-wallet
    env_file:
      - ./infra/.env
    environment:
      PORT: 8112
      PGHOST: aqond-db
      PGDATABASE: commerce
      PGUSER: ${POSTGRES_USER:-admin_boss}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      WALLET_API_KEY: ${ESCROW_API_KEY}
    networks:
      - aqond-network
    depends_on:
      aqond-db:
        condition: service_healthy
    restart: unless-stopped

  order-svc:
    profiles:
      - dev-lite
    build:
      context: .
      dockerfile: services/order-svc/Dockerfile
    container_name: aqond-v2-order
    env_file:
      - ./infra/.env
    environment:
      PORT: 8113
      PGHOST: aqond-db
      PGDATABASE: commerce
