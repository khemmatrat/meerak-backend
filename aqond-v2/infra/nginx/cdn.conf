# P39: dev-lite CDN edge cache in front of MinIO video bucket
proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn_cache:32m max_size=1g inactive=24h use_temp_path=off;

upstream minio_upstream {
    server minio:9000;
}

server {
    listen 8098;
    server_name _;

    location /cdn/ {
        if ($arg_exp = "") { return 403; }
        if ($arg_sig = "") { return 403; }

        proxy_pass http://minio_upstream/aqond-videos/;
        proxy_set_header Host minio:9000;
        proxy_cache cdn_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=3600";
    }

    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
