# P171 SLO definitions — sync with commerce.slo_definitions seed + Prometheus rules.

journeys:
  checkout:
    availability_target: 0.9995
    latency_p99_ms: 2000
    error_budget_window_days: 30
  flash_buy:
    availability_target: 0.999
    latency_p99_ms: 500
    oversell_tolerance: 0
  feed:
    availability_target: 0.995
    latency_p99_ms: 800
  search:
    availability_target: 0.999
    latency_p99_ms: 300
  payment:
    availability_target: 0.9999
    latency_p99_ms: 1500
  live:
    availability_target: 0.995
    latency_p99_ms: 1000

burn_alerts:
  fast_burn:
    window: 1h
    budget_fraction: 0.02
  slow_burn:
    window: 6h
    budget_fraction: 0.05

release_gates:
  block_on_fast_burn: true
  block_on_no_go_readiness: true
