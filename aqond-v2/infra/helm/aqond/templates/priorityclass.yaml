apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClasses.hotPath }}
  labels:
    {{- include "aqond.labels" . | nindent 4 }}
value: 1000000
globalDefault: false
description: Flash-sale hot path services (order, inventory, catalog)
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClasses.batch }}
  labels:
    {{- include "aqond.labels" . | nindent 4 }}
value: 100000
globalDefault: false
description: Batch/async workers (transcode, foundation)
