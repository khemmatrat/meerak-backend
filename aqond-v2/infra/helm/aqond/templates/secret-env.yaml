# Template — populate via External Secrets / sealed-secrets in prod (P80)
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.existingSecret }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aqond.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: "changeme-in-prod"
  ESCROW_API_KEY: "changeme"
  AI_CORE_API_KEY: "changeme"
  CDN_SIGNING_SECRET: "dev-cdn-sign-secret"
