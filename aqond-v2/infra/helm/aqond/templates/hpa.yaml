{{- if .Values.autoscaling.hpa.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (gt ($svc.port | int) 0) (not $svc.kedaScaleToZero) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "aqond.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $.Values.autoscaling.hpa.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.hpa.targetCPU }}
{{- end }}
{{- end }}
{{- end }}
