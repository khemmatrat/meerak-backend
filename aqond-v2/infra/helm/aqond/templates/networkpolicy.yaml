{{- if .Values.security.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aqond-default-deny-ingress
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aqond-allow-gateway
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - catalog-svc
          - inventory-svc
          - order-svc
          - wallet-svc
          - readmodel-svc
          - feed-svc
          - video-svc
          - rec-svc
          - foundation-svc
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: kong
      ports:
        - protocol: TCP
          port: 8110
        - protocol: TCP
          port: 8111
        - protocol: TCP
          port: 8112
        - protocol: TCP
          port: 8113
        - protocol: TCP
          port: 8114
        - protocol: TCP
          port: 8115
        - protocol: TCP
          port: 8116
        - protocol: TCP
          port: 8117
        - protocol: TCP
          port: 8101
{{- end }}
