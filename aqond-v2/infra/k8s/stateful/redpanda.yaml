apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: aqond-dev
spec:
  ports:
    - name: kafka
      port: 9092
  selector:
    app: redpanda
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: aqond-dev
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
          command:
            - redpanda
            - start
            - --kafka-addr internal://0.0.0.0:9092
            - --advertise-kafka-addr internal://redpanda:9092
            - --smp
            - "1"
            - --memory
            - 512M
            - --overprovisioned
          ports:
            - containerPort: 9092
