# P79: In-cluster k6 load test Job
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-flash-sale
  namespace: aqond-dev
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          args:
            - run
            - /scripts/flash-sale.js
          env:
            - name: KONG
              value: http://kong-proxy
            - name: VUS
              value: "30"
            - name: DURATION
              value: "60s"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: k6-scripts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-scripts
  namespace: aqond-dev
data:
  flash-sale.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    export const options = { vus: 10, duration: '30s' };
    export default function () {
      const r = http.get(__ENV.KONG + '/api/v1/catalog/v1/stores');
      check(r, { 'ok': (x) => x.status === 200 });
      sleep(1);
    }
